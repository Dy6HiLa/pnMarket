storage:
  # sqlite, mysql или mongodb. SQLite работает без отдельного сервера.
  type: sqlite
  sqlite:
    # Файл создаётся в plugins/pnMarket/.
    file: "market.db"
  mysql:
    # Можно указать полный JDBC URL вместо host/port/database.
    url: ""
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
  mongo:
    # Для production задайте PNMARKET_MONGO_URI в окружении сервера.
    uri: "mongodb://localhost:27017"
    database: "minecraft"
    collection: "auction"
limits:
  # Максимум одновременно активных лотов игрока. default действует для всех,
  # а ключ с названием группы Vault переопределяет лимит для этой группы.
  default: 3
  gifest: 10

listing-expiry:
  # Срок жизни лота в часах. ExcellentEconomy может использоваться через Vault.
  hours: 24
  groups: {}

auto-sell:
  price-multiplier: 1.0

currencies:
  vault:
    enabled: true
    amount-placeholder: "%vault_eco_balance%"
    withdraw-command: ""
    deposit-command: ""

listing-price:
  # Цена за весь лот, не за одну единицу предмета. maximum: 0 отключает верхнюю границу.
  minimum: 1
  maximum: 1000000

donate-listing-price:
  # Цена выставления на /dah sell в PlayerPoints. Она делится на количество предметов в лоте.
  minimum: 1
  maximum: 1000000

# Шаблоны цены. {price} заменяется на сумму; поддерживаются стандартные цвета &.
prefix-vault: "&a{price}⛃"
prefix-playerpoints: "&d{price} PP"

# /ah kit и /dah kit забирают занятые слоты основного инвентаря в один лот.
kits:
  # Лимит занятых слотов зависит от основной Vault-группы игрока.
  max-slots:
    default: 10
    vip: 15
    admin: 36
  # Защита БД и клиента от предметов с чрезмерно большим NBT/PDC.
  max-serialized-bytes: 131072
  blocked-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW

# Статистика активных лотов с полностью похожим предметом.
price-statistics:
  enabled: true
  permission: "pnmarket.admin"
  minimum-samples: 1

# Избранные материалы/названия и уведомления о новых лотах.
notifications:
  enabled: true
  max-favorites: 10

# Категории отображаются в указанном порядке. Можно добавлять свои секции.
# Правила категории: materials - точные Material ID, material-contains - часть Material ID,
# name-contains - часть пользовательского названия, edible - все съедобные предметы.
categories:
  bundles:
    name: "Наборы"
    name-contains: ["Набор"]
  weapon:
    name: "Оружие"
    material-contains: ["_SWORD", "_AXE", "BOW", "CROSSBOW", "TRIDENT"]
  armor:
    name: "Снаряжение"
    material-contains: ["_HELMET", "_CHESTPLATE", "_LEGGINGS", "_BOOTS", "ELYTRA", "SHIELD"]
  food:
    name: "Еда"
    edible: true
  potion:
    name: "Зелья"
    materials: ["POTION", "SPLASH_POTION", "LINGERING_POTION", "TIPPED_ARROW"]
  ore:
    name: "Руды"
    material-contains: ["ORE", "INGOT", "NUGGET", "GEM"]
  sphere:
    name: "Сферы"
    name-contains: ["сфера"]
  donate:
    name: "Донат-предметы"
    name-contains: ["донат", "donate"]
