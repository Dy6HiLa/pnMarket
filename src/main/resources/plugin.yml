name: pnMarket
version: '${version}'
main: ru.privatenull.PnMarketPlugin
api-version: '1.16'
authors: [ privatenull ]
description: pnMarket - AuctionPlugin
website: https://github.com/pnFolder/pnMarket
depend: [ProtocolLib]
softdepend: [pnLibrary, Vault, PlayerPoints, ExcellentEconomy]
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.mysql:mysql-connector-j:8.4.0
  - org.mongodb:mongodb-driver-sync:4.11.1
commands:
  dah:
    description: Команда для открытия аукциона pnMarket
  ah:
    description: Команда для открытия аукциона pnMarket
permissions:
  pnmarket.sell.auto:
    description: Автоматически рассчитывать цену лота через /ah sell auto
    default: false
  pnmarket.admin:
    description: Управление pnMarket и уведомления об обновлениях
    default: op
